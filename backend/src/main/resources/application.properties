spring.application.name=tutofast-backend
server.port=${PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Transacciones (true en Atlas/Render; false con Mongo local sin replica set)
tutofast.mongo.transacciones=${MONGO_TRANSACCIONES:false}

# JWT
tutofast.jwt.secreto=${JWT_SECRET}
tutofast.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# Administrador inicial (seed opcional; se crea solo si no existe ningún ADMINISTRADOR)
tutofast.admin.correo=${ADMIN_CORREO:}
tutofast.admin.clave=${ADMIN_CLAVE:}

# CORS
tutofast.cors.frontend-url=${FRONTEND_URL:http://localhost:5500}

# Subida de archivos (10 MB por archivo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
